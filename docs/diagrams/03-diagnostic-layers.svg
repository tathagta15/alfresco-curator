<svg xmlns="http://www.w3.org/2000/svg" width="1092" height="924" viewBox="4.0 -12.0 1092.0 924.0"><defs><marker id="a1e1e1e" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e1e1e"/></marker></defs><rect x="4.0" y="-12.0" width="1092.0" height="924.0" fill="#ffffff"/><text x="40.0" y="46.1" fill="#1e1e1e" font-size="24" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" text-anchor="start">Diagnose — why did this document not match?</text><text x="40.0" y="72.9" fill="#5c5f66" font-size="14" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" text-anchor="start">Input: the failing query plus the node that should have matched. Every layer is a live probe.</text><rect x="400.0" y="110.0" width="320.0" height="60.0" rx="12" fill="none" stroke="#1e1e1e" stroke-width="2"/><text x="560.0" y="144.7" fill="#1e1e1e" font-size="16" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" text-anchor="middle">Failing query  +  node id</text><polyline points="560.0,170.0 560.0,210.0" fill="none" stroke="#1e1e1e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a1e1e1e)"/><rect x="60.0" y="220.0" width="190.0" height="80.0" rx="12" fill="#c5f6fa" stroke="#1098ad" stroke-width="2"/><text x="155.0" y="264.4" fill="#1098ad" font-size="15" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" text-anchor="middle">1 · Metadata</text><rect x="290.0" y="220.0" width="400.0" height="80.0" rx="12" fill="none" stroke="#1e1e1e" stroke-width="2"/><text x="490.0" y="255.7" fill="#1e1e1e" font-size="13" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" text-anchor="middle">Replay each clause scoped to the node</text><text x="490.0" y="272.0" fill="#1e1e1e" font-size="13" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" text-anchor="middle">ID:"..." AND (clause)</text><rect x="730.0" y="220.0" width="330.0" height="80.0" rx="12" fill="#ffec99" stroke="#e8590c" stroke-width="2"/><text x="895.0" y="255.7" fill="#e8590c" font-size="13" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" text-anchor="middle">cm:description is STATUS:DRAFT,</text><text x="895.0" y="272.0" fill="#e8590c" font-size="13" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" text-anchor="middle">not APPROVED</text><rect x="60.0" y="330.0" width="190.0" height="80.0" rx="12" fill="#c5f6fa" stroke="#1098ad" stroke-width="2"/><text x="155.0" y="374.4" fill="#1098ad" font-size="15" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" text-anchor="middle">2 · Path boundary</text><rect x="290.0" y="330.0" width="400.0" height="80.0" rx="12" fill="none" stroke="#1e1e1e" stroke-width="2"/><text x="490.0" y="365.7" fill="#1e1e1e" font-size="13" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" text-anchor="middle">Probe the PATH clause against the node,</text><text x="490.0" y="382.0" fill="#1e1e1e" font-size="13" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" text-anchor="middle">and walk the folder back up</text><rect x="730.0" y="330.0" width="330.0" height="80.0" rx="12" fill="#ffec99" stroke="#e8590c" stroke-width="2"/><text x="895.0" y="365.7" fill="#e8590c" font-size="13" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" text-anchor="middle">node lives in /Engineering,</text><text x="895.0" y="382.0" fill="#e8590c" font-size="13" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" text-anchor="middle">query asked for /Finance</text><polyline points="155.0,300.0 155.0,330.0" fill="none" stroke="#1e1e1e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a1e1e1e)"/><rect x="60.0" y="440.0" width="190.0" height="80.0" rx="12" fill="#c5f6fa" stroke="#1098ad" stroke-width="2"/><text x="155.0" y="484.4" fill="#1098ad" font-size="15" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" text-anchor="middle">3 · Permissions</text><rect x="290.0" y="440.0" width="400.0" height="80.0" rx="12" fill="none" stroke="#1e1e1e" stroke-width="2"/><text x="490.0" y="475.7" fill="#1e1e1e" font-size="13" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" text-anchor="middle">Indexed READER / DENIED vs the user's</text><text x="490.0" y="492.0" fill="#1e1e1e" font-size="13" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" text-anchor="middle">authorities; parent folder ACL</text><rect x="730.0" y="440.0" width="330.0" height="80.0" rx="12" fill="#ffec99" stroke="#e8590c" stroke-width="2"/><text x="895.0" y="475.7" fill="#e8590c" font-size="13" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" text-anchor="middle">inheritance on, but only</text><text x="895.0" y="492.0" fill="#e8590c" font-size="13" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" text-anchor="middle">GROUP_ARCHITECTS granted</text><polyline points="155.0,410.0 155.0,440.0" fill="none" stroke="#1e1e1e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a1e1e1e)"/><rect x="60.0" y="550.0" width="190.0" height="80.0" rx="12" fill="#c5f6fa" stroke="#1098ad" stroke-width="2"/><text x="155.0" y="594.4" fill="#1098ad" font-size="15" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" text-anchor="middle">4 · Analyzer</text><rect x="290.0" y="550.0" width="400.0" height="80.0" rx="12" fill="none" stroke="#1e1e1e" stroke-width="2"/><text x="490.0" y="585.7" fill="#1e1e1e" font-size="13" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" text-anchor="middle">Elasticsearch _analyze on both the clause</text><text x="490.0" y="602.0" fill="#1e1e1e" font-size="13" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" text-anchor="middle">value and the stored value</text><rect x="730.0" y="550.0" width="330.0" height="80.0" rx="12" fill="#ffec99" stroke="#e8590c" stroke-width="2"/><text x="895.0" y="585.7" fill="#e8590c" font-size="13" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" text-anchor="middle">all terms present, phrase</text><text x="895.0" y="602.0" fill="#e8590c" font-size="13" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" text-anchor="middle">order is what fails</text><polyline points="155.0,520.0 155.0,550.0" fill="none" stroke="#1e1e1e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a1e1e1e)"/><rect x="60.0" y="660.0" width="190.0" height="80.0" rx="12" fill="#c5f6fa" stroke="#1098ad" stroke-width="2"/><text x="155.0" y="704.4" fill="#1098ad" font-size="15" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" text-anchor="middle">5 · Pipeline</text><rect x="290.0" y="660.0" width="400.0" height="80.0" rx="12" fill="none" stroke="#1e1e1e" stroke-width="2"/><text x="490.0" y="695.7" fill="#1e1e1e" font-size="13" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" text-anchor="middle">Indexer watermarks, ES document, broker</text><text x="490.0" y="712.0" fill="#1e1e1e" font-size="13" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" text-anchor="middle">backlog — gated, not always run</text><rect x="730.0" y="660.0" width="330.0" height="80.0" rx="12" fill="#ffec99" stroke="#e8590c" stroke-width="2"/><text x="895.0" y="695.7" fill="#e8590c" font-size="13" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" text-anchor="middle">indexed copy older than</text><text x="895.0" y="712.0" fill="#e8590c" font-size="13" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" text-anchor="middle">the repository version</text><polyline points="155.0,630.0 155.0,660.0" fill="none" stroke="#1e1e1e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a1e1e1e)"/><polyline points="560.0,760.0 560.0,800.0" fill="none" stroke="#1e1e1e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a1e1e1e)"/><rect x="400.0" y="800.0" width="320.0" height="76.0" rx="12" fill="#f3d9fa" stroke="#9c36b5" stroke-width="2"/><text x="560.0" y="833.0" fill="#9c36b5" font-size="15" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" text-anchor="middle">Grounded report</text><text x="560.0" y="851.8" fill="#9c36b5" font-size="15" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" text-anchor="middle">root cause · evidence · fix</text><text x="60.0" y="812.0" fill="#c92a2a" font-size="13" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" text-anchor="start">Layer 5 is gated by pipeline_is_implicated(): tracing costs several</text><text x="60.0" y="828.2" fill="#c92a2a" font-size="13" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" text-anchor="start">round trips, so it runs only when the query has been cleared.</text><text x="760.0" y="812.0" fill="#9c36b5" font-size="13" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" text-anchor="start">The model receives these findings.</text><text x="760.0" y="828.2" fill="#9c36b5" font-size="13" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" text-anchor="start">It never produces them.</text></svg>
