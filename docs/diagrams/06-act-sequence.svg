troke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a1e1e1e)"/><text x="295.6" y="806.0" fill="#1e1e1e" font-size="12" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" text-anchor="start">approve</text><polyline points="480.0,894.0 1120.0,894.0" fill="none" stroke="#1e1e1e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a1e1e1e)"/><text x="779.1" y="876.0" fill="#1e1e1e" font-size="12" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" text-anchor="start">resume</text><polyline points="1120.0,964.0 1440.0,964.0" fill="none" stroke="#5c7cfa" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a5c7cfa)"/><text x="1255.6" y="946.0" fill="#5c7cfa" font-size="12" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" text-anchor="start">add_tag</text><polyline points="1120.0,1034.0 1760.0,1034.0" fill="none" stroke="#1e1e1e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a1e1e1e)"/><text x="1335.6" y="1016.0" fill="#1e1e1e" font-size="12" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" text-anchor="start">record the inverse: remove_tag</text><polyline points="480.0,1104.0 160.0,1104.0" fill="none" stroke="#5c5f66" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="8 6" marker-end="url(#a5c5f66)"/><text x="170.4" y="1086.0" fill="#5c5f66" font-size="12" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" text-anchor="start">done — undoable for the rest of the session</text><text x="40.0" y="1216.0" fill="#c92a2a" font-size="13" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" text-anchor="start">The budget is charged before the call, so a refused change costs nothing and a failing</text><text x="40.0" y="1232.2" fill="#c92a2a" font-size="13" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" text-anchor="start">tool cannot walk past the limit by retrying.</text></svg>
