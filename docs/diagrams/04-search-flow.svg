<svg xmlns="http://www.w3.org/2000/svg" width="1229" height="650" viewBox="4.0 -12.0 1229.3 650.5"><defs><marker id="a1e1e1e" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e1e1e"/></marker></defs><rect x="4.0" y="-12.0" width="1229.3" height="650.5" fill="#ffffff"/><text x="40.0" y="46.1" fill="#1e1e1e" font-size="24" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" text-anchor="start">Search — natural language to a repository query</text><text x="40.0" y="72.9" fill="#5c5f66" font-size="14" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" text-anchor="start">The query language is detected from the deployment, never chosen by whoever is searching.</text><rect x="60.0" y="120.0" width="420.0" height="76.0" rx="12" fill="none" stroke="#1e1e1e" stroke-width="2"/><text x="270.0" y="162.1" fill="#1e1e1e" font-size="14" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" text-anchor="middle">Plain English prompt</text><rect x="60.0" y="220.0" width="420.0" height="76.0" rx="12" fill="#c5f6fa" stroke="#1098ad" stroke-width="2"/><text x="270.0" y="253.4" fill="#1098ad" font-size="14" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" text-anchor="middle">detect_query_language()</text><text x="270.0" y="270.9" fill="#1098ad" font-size="14" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" text-anchor="middle">ask the repository once, then cache</text><polyline points="270.0,196.0 270.0,220.0" fill="none" stroke="#1e1e1e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a1e1e1e)"/><rect x="60.0" y="320.0" width="420.0" height="76.0" rx="12" fill="#f3d9fa" stroke="#9c36b5" stroke-width="2"/><text x="270.0" y="353.4" fill="#9c36b5" font-size="14" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" text-anchor="middle">generate_query()</text><text x="270.0" y="370.9" fill="#9c36b5" font-size="14" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" text-anchor="middle">model writes AFTS or Lucene</text><polyline points="270.0,296.0 270.0,320.0" fill="none" stroke="#1e1e1e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a1e1e1e)"/><rect x="60.0" y="420.0" width="420.0" height="76.0" rx="12" fill="#c5f6fa" stroke="#1098ad" stroke-width="2"/><text x="270.0" y="453.4" fill="#1098ad" font-size="14" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" text-anchor="middle">path_problems() + advisories()</text><text x="270.0" y="470.9" fill="#1098ad" font-size="14" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" text-anchor="middle">structural repair, one retry</text><polyline points="270.0,396.0 270.0,420.0" fill="none" stroke="#1e1e1e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a1e1e1e)"/><rect x="60.0" y="520.0" width="420.0" height="76.0" rx="12" fill="#c5f6fa" stroke="#1098ad" stroke-width="2"/><text x="270.0" y="553.4" fill="#1098ad" font-size="14" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" text-anchor="middle">search_afts()</text><text x="270.0" y="570.9" fill="#1098ad" font-size="14" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" text-anchor="middle">execute against the repository</text><polyline points="270.0,496.0 270.0,520.0" fill="none" stroke="#1e1e1e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a1e1e1e)"/><rect x="560.0" y="420.0" width="140.0" height="60.0" rx="12" fill="#ffec99" stroke="#e8590c" stroke-width="2"/><text x="630.0" y="454.4" fill="#e8590c" font-size="15" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" text-anchor="middle">hits ?</text><polyline points="480.0,458.0 560.0,458.0" fill="none" stroke="#1e1e1e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a1e1e1e)"/><rect x="760.0" y="300.0" width="340.0" height="80.0" rx="12" fill="none" stroke="#1e1e1e" stroke-width="2"/><text x="930.0" y="335.4" fill="#1e1e1e" font-size="14" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" text-anchor="middle">Result cards</text><text x="930.0" y="352.9" fill="#1e1e1e" font-size="14" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" text-anchor="middle">thumbnail · title · status · Open</text><polyline points="700.0,440.0 760.0,380.0" fill="none" stroke="#1e1e1e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a1e1e1e)"/><text x="713.0" y="401.0" fill="#1e1e1e" font-size="12" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" text-anchor="start">found</text><rect x="760.0" y="430.0" width="340.0" height="120.0" rx="12" fill="#c5f6fa" stroke="#1098ad" stroke-width="2"/><text x="930.0" y="469.5" fill="#1098ad" font-size="13" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" text-anchor="middle">Zero-hit forensics</text><text x="930.0" y="485.7" fill="#1098ad" font-size="13" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" text-anchor="middle">clause reach — which term matches nothing</text><text x="930.0" y="502.0" fill="#1098ad" font-size="13" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" text-anchor="middle">narrowing — which combination empties it</text><text x="930.0" y="518.2" fill="#1098ad" font-size="13" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" text-anchor="middle">path reach — which folder step is wrong</text><polyline points="700.0,470.0 760.0,480.0" fill="none" stroke="#1e1e1e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a1e1e1e)"/><text x="716.4" y="466.0" fill="#1e1e1e" font-size="12" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" text-anchor="start">none</text><text x="760.0" y="582.0" fill="#1098ad" font-size="13" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" text-anchor="start">A zero-hit search is the interesting case: it is otherwise</text><text x="760.0" y="598.2" fill="#1098ad" font-size="13" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" text-anchor="start">indistinguishable from an empty repository.</text></svg>
