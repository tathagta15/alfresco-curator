<svg xmlns="http://www.w3.org/2000/svg" width="1912" height="1301" viewBox="4.0 -12.0 1912.0 1300.8"><defs><marker id="a1e1e1e" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e1e1e"/></marker><marker id="a5c5f66" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5c5f66"/></marker><marker id="a5c7cfa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5c7cfa"/></marker><marker id="a9c36b5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9c36b5"/></marker></defs><rect x="4.0" y="-12.0" width="1912.0" height="1300.8" fill="#ffffff"/><text x="40.0" y="46.1" fill="#1e1e1e" font-size="24" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" text-anchor="start">One ask, answered</text><text x="40.0" y="72.9" fill="#5c5f66" font-size="14" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" text-anchor="start">The route is decided before any engine runs, so the panel can say what it is about to do.</text><rect x="40.0" y="130.0" width="240.0" height="64.0" rx="12" fill="#d0ebff" stroke="#1971c2" stroke-width="2"/><text x="160.0" y="157.4" fill="#1971c2" font-size="14" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" text-anchor="middle">Panel</text><text x="160.0" y="174.9" fill="#1971c2" font-size="14" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" text-anchor="middle">browser</text><rect x="360.0" y="130.0" width="240.0" height="64.0" rx="12" fill="#d3f9d8" stroke="#2f9e44" stroke-width="2"/><text x="480.0" y="157.4" fill="#2f9e44" font-size="14" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" text-anchor="middle">Curator API</text><text x="480.0" y="174.9" fill="#2f9e44" font-size="14" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" text-anchor="middle">FastAPI</text><rect x="680.0" y="130.0" width="240.0" height="64.0" rx="12" fill="#ffec99" stroke="#e8590c" stroke-width="2"/><text x="800.0" y="157.4" fill="#e8590c" font-size="14" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" text-anchor="middle">Router</text><text x="800.0" y="174.9" fill="#e8590c" font-size="14" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" text-anchor="middle">intent.py</text><rect x="1000.0" y="130.0" width="240.0" height="64.0" rx="12" fill="#c5f6fa" stroke="#1098ad" stroke-width="2"/><text x="1120.0" y="157.4" fill="#1098ad" font-size="14" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" text-anchor="middle">Ladder</text><text x="1120.0" y="174.9" fill="#1098ad" font-size="14" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" text-anchor="middle">graph.py</text><rect x="1320.0" y="130.0" width="240.0" height="64.0" rx="12" fill="#f3d9fa" stroke="#9c36b5" stroke-width="2"/><text x="1440.0" y="157.4" fill="#9c36b5" font-size="14" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" text-anchor="middle">LLM</text><text x="1440.0" y="174.9" fill="#9c36b5" font-size="14" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" text-anchor="middle">gateway</text><rect x="1640.0" y="130.0" width="240.0" height="64.0" rx="12" fill="#d0ebff" stroke="#1971c2" stroke-width="2"/><text x="1760.0" y="157.4" fill="#1971c2" font-size="14" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" text-anchor="middle">Alfresco</text><text x="1760.0" y="174.9" fill="#1971c2" font-size="14" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" text-anchor="middle">Search API</text><polyline points="160.0,194.0 160.0,1174.0" fill="none" stroke="#adb5bd" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="8 6"/><polyline points="480.0,194.0 480.0,1174.0" fill="none" stroke="#adb5bd" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="8 6"/><polyline points="800.0,194.0 800.0,1174.0" fill="none" stroke="#adb5bd" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="8 6"/><polyline points="1120.0,194.0 1120.0,1174.0" fill="none" stroke="#adb5bd" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="8 6"/><polyline points="1440.0,194.0 1440.0,1174.0" fill="none" stroke="#adb5bd" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="8 6"/><polyline points="1760.0,194.0 1760.0,1174.0" fill="none" stroke="#adb5bd" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="8 6"/><polyline points="160.0,264.0 480.0,264.0" fill="none" stroke="#1e1e1e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a1e1e1e)"/><text x="229.5" y="246.0" fill="#1e1e1e" font-size="12" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" text-anchor="start">POST /api/agent/ask/stream</text><polyline points="480.0,334.0 800.0,334.0" fill="none" stroke="#1e1e1e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a1e1e1e)"/><text x="514.7" y="316.0" fill="#1e1e1e" font-size="12" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" text-anchor="start">classify(prompt) — lexical, no model</text><polyline points="800.0,404.0 480.0,404.0" fill="none" stroke="#5c5f66" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="8 6" marker-end="url(#a5c5f66)"/><text x="535.6" y="386.0" fill="#5c5f66" font-size="12" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" text-anchor="start">route = search, writes = false</text><polyline points="480.0,474.0 160.0,474.0" fill="none" stroke="#5c5f66" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="8 6" marker-end="url(#a5c5f66)"/><text x="128.6" y="456.0" fill="#5c5f66" font-size="12" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" text-anchor="start">event: route — the badge appears before any search runs</text><polyline points="480.0,544.0 1120.0,544.0" fill="none" stroke="#1e1e1e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a1e1e1e)"/><text x="761.7" y="526.0" fill="#1e1e1e" font-size="12" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" text-anchor="start">run(prompt)</text><polyline points="1120.0,614.0 1440.0,614.0" fill="none" stroke="#9c36b5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a9c36b5)"/><text x="1220.8" y="596.0" fill="#9c36b5" font-size="12" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" text-anchor="start">translate to AFTS</text><polyline points="1440.0,684.0 1120.0,684.0" fill="none" stroke="#5c5f66" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="8 6" marker-end="url(#a5c5f66)"/><text x="1158.2" y="666.0" fill="#5c5f66" font-size="12" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" text-anchor="start">TYPE:"cm:content" AND TEXT:"unpaid"</text><polyline points="1120.0,754.0 1760.0,754.0" fill="none" stroke="#5c7cfa" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a5c7cfa)"/><text x="1314.7" y="736.0" fill="#5c7cfa" font-size="12" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" text-anchor="start">POST /search — as the signed-in user</text><polyline points="1760.0,824.0 1120.0,824.0" fill="none" stroke="#5c5f66" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="8 6" marker-end="url(#a5c5f66)"/><text x="1419.1" y="806.0" fill="#5c5f66" font-size="12" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" text-anchor="start">2 hits</text><polyline points="480.0,894.0 160.0,894.0" fill="none" stroke="#5c5f66" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="8 6" marker-end="url(#a5c5f66)"/><text x="229.5" y="876.0" fill="#5c5f66" font-size="12" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" text-anchor="start">event: step — plan, search</text><polyline points="1120.0,964.0 1440.0,964.0" fill="none" stroke="#9c36b5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a9c36b5)"/><text x="1161.7" y="946.0" fill="#9c36b5" font-size="12" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" text-anchor="start">write the report from the evidence</text><polyline points="1440.0,1034.0 160.0,1034.0" fill="none" stroke="#5c5f66" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="8 6" marker-end="url(#a5c5f66)"/><text x="633.0" y="1016.0" fill="#5c5f66" font-size="12" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" text-anchor="start">event: token — the report grows a word at a time</text><polyline points="480.0,1104.0 160.0,1104.0" fill="none" stroke="#5c5f66" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="8 6" marker-end="url(#a5c5f66)"/><text x="271.3" y="1086.0" fill="#5c5f66" font-size="12" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" text-anchor="start">payload + done</text><text x="40.0" y="1216.0" fill="#c92a2a" font-size="13" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" text-anchor="start">The model is called twice, and both times it is handed evidence that was</text><text x="40.0" y="1232.2" fill="#c92a2a" font-size="13" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" text-anchor="start">already gathered. It never decides what to probe, so the same question</text><text x="40.0" y="1248.5" fill="#c92a2a" font-size="13" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" text-anchor="start">yields the same investigation.</text></svg>
