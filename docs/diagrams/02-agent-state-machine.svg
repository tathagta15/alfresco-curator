<svg xmlns="http://www.w3.org/2000/svg" width="1335" height="1140" viewBox="4.0 -12.0 1334.6 1140.5"><defs><marker id="a1098ad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1098ad"/></marker><marker id="a1e1e1e" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e1e1e"/></marker></defs><rect x="4.0" y="-12.0" width="1334.6" height="1140.5" fill="#ffffff"/><text x="40.0" y="46.1" fill="#1e1e1e" font-size="24" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" text-anchor="start">Agent — deterministic escalation ladder</text><text x="40.0" y="72.9" fill="#5c5f66" font-size="14" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" text-anchor="start">The controller is code, not the model. Infrastructure is blamed only once the query is cleared.</text><rect x="400.0" y="120.0" width="120.0" height="50.0" rx="12" fill="none" stroke="#1e1e1e" stroke-width="2"/><text x="460.0" y="149.1" fill="#1e1e1e" font-size="14" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" text-anchor="middle">START</text><rect x="300.0" y="220.0" width="320.0" height="76.0" rx="12" fill="#f3d9fa" stroke="#9c36b5" stroke-width="2"/><text x="460.0" y="253.4" fill="#9c36b5" font-size="14" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" text-anchor="middle">plan</text><text x="460.0" y="270.9" fill="#9c36b5" font-size="14" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" text-anchor="middle">translate to AFTS / Lucene</text><rect x="300.0" y="350.0" width="320.0" height="76.0" rx="12" fill="#c5f6fa" stroke="#1098ad" stroke-width="2"/><text x="460.0" y="383.4" fill="#1098ad" font-size="14" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" text-anchor="middle">search</text><text x="460.0" y="400.9" fill="#1098ad" font-size="14" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" text-anchor="middle">execute against the repository</text><rect x="370.0" y="480.0" width="180.0" height="60.0" rx="12" fill="#ffec99" stroke="#e8590c" stroke-width="2"/><text x="460.0" y="514.4" fill="#e8590c" font-size="15" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" text-anchor="middle">hits &gt; 0 ?</text><rect x="300.0" y="610.0" width="320.0" height="76.0" rx="12" fill="#c5f6fa" stroke="#1098ad" stroke-width="2"/><text x="460.0" y="643.7" fill="#1098ad" font-size="13" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" text-anchor="middle">forensics</text><text x="460.0" y="660.0" fill="#1098ad" font-size="13" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" text-anchor="middle">clause reach · narrowing · path reach</text><rect x="300.0" y="740.0" width="320.0" height="76.0" rx="12" fill="#c5f6fa" stroke="#1098ad" stroke-width="2"/><text x="460.0" y="773.7" fill="#1098ad" font-size="13" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" text-anchor="middle">recover</text><text x="460.0" y="790.0" fill="#1098ad" font-size="13" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" text-anchor="middle">re-run without the dead clause</text><rect x="320.0" y="870.0" width="280.0" height="60.0" rx="12" fill="#ffec99" stroke="#e8590c" stroke-width="2"/><text x="460.0" y="904.1" fill="#e8590c" font-size="14" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" text-anchor="middle">dead clause or dead path ?</text><rect x="300.0" y="1000.0" width="320.0" height="76.0" rx="12" fill="#c5f6fa" stroke="#1098ad" stroke-width="2"/><text x="460.0" y="1033.4" fill="#1098ad" font-size="14" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" text-anchor="middle">infra</text><text x="460.0" y="1050.9" fill="#1098ad" font-size="14" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" text-anchor="middle">pipeline telemetry sweep</text><rect x="820.0" y="610.0" width="300.0" height="76.0" rx="12" fill="#f3d9fa" stroke="#9c36b5" stroke-width="2"/><text x="970.0" y="643.0" fill="#9c36b5" font-size="15" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" text-anchor="middle">report</text><text x="970.0" y="661.8" fill="#9c36b5" font-size="15" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" text-anchor="middle">answer  ·  postmortem</text><rect x="820.0" y="740.0" width="300.0" height="68.0" rx="12" fill="#c5f6fa" stroke="#1098ad" stroke-width="2"/><text x="970.0" y="769.4" fill="#1098ad" font-size="14" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" text-anchor="middle">remember</text><text x="970.0" y="786.9" fill="#1098ad" font-size="14" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" text-anchor="middle">append to thread history</text><rect x="910.0" y="870.0" width="120.0" height="50.0" rx="12" fill="none" stroke="#1e1e1e" stroke-width="2"/><text x="970.0" y="899.1" fill="#1e1e1e" font-size="14" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" text-anchor="middle">END</text><polyline points="460.0,170.0 460.0,220.0" fill="none" stroke="#1e1e1e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a1e1e1e)"/><polyline points="460.0,296.0 460.0,350.0" fill="none" stroke="#1e1e1e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a1e1e1e)"/><polyline points="460.0,426.0 460.0,480.0" fill="none" stroke="#1e1e1e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a1e1e1e)"/><polyline points="460.0,540.0 460.0,610.0" fill="none" stroke="#1e1e1e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a1e1e1e)"/><text x="474.0" y="571.0" fill="#1e1e1e" font-size="12" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" text-anchor="start">no — investigate</text><polyline points="460.0,686.0 460.0,740.0" fill="none" stroke="#1e1e1e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a1e1e1e)"/><polyline points="460.0,816.0 460.0,870.0" fill="none" stroke="#1e1e1e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a1e1e1e)"/><polyline points="460.0,930.0 460.0,1000.0" fill="none" stroke="#1e1e1e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a1e1e1e)"/><text x="474.0" y="961.0" fill="#1e1e1e" font-size="12" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" text-anchor="start">no — sweep the pipeline</text><polyline points="550.0,510.0 820.0,510.0 820.0,648.0" fill="none" stroke="#1e1e1e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a1e1e1e)"/><text x="568.0" y="497.0" fill="#1e1e1e" font-size="12" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" text-anchor="start">yes</text><polyline points="600.0,900.0 820.0,900.0 820.0,672.0" fill="none" stroke="#1e1e1e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a1e1e1e)"/><text x="612.0" y="857.0" fill="#1e1e1e" font-size="12" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" text-anchor="start">yes — the query is at fault</text><polyline points="620.0,1038.0 970.0,1038.0 970.0,686.0" fill="none" stroke="#1098ad" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a1098ad)"/><polyline points="970.0,686.0 970.0,740.0" fill="none" stroke="#1e1e1e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a1e1e1e)"/><polyline points="970.0,808.0 970.0,870.0" fill="none" stroke="#1e1e1e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a1e1e1e)"/><text x="820.0" y="972.0" fill="#9c36b5" font-size="13" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" text-anchor="start">Only two nodes call the model, and both are handed evidence that</text><text x="820.0" y="988.2" fill="#9c36b5" font-size="13" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" text-anchor="start">was already gathered. The model narrates; it never decides what</text><text x="820.0" y="1004.5" fill="#9c36b5" font-size="13" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" text-anchor="start">to probe, so the same question yields the same investigation.</text><text x="820.0" y="1072.0" fill="#5c5f66" font-size="13" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" text-anchor="start">Cache: count::user::query and infra::sweep (30s TTL).</text><text x="820.0" y="1088.2" fill="#5c5f66" font-size="13" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" text-anchor="start">Checkpoint: MemorySaver per thread_id for multi-turn memory.</text></svg>
